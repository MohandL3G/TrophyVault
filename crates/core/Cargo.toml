[package]
name = "trophyvault-core"
version = "0.0.12"
edition = "2021"
authors = ["MohandL3G"]
description = "TrophyVault: Core library for data models, parsing, and passport generation"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
resvg = "0.44"
usvg = "0.44"
tiny-skia = "0.11"
fontdb = "0.18"
ureq = { version = "2.10", features = ["json"] }
dirs = "5.0"
