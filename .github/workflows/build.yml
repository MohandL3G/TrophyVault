name: CI TrophyVault Server

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test-and-build:
    name: Test & Build Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Workspace Unit & Integration Tests
        run: cargo test --verbose --workspace

      - name: Build Server Release Binary
        run: cargo build --release -p trophyvault-server --verbose

      - name: Upload Server Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trophyvault-server-linux
          path: target/release/trophyvault-server
          if-no-files-found: error
