name: Build Achievements Passport Desktop

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Build Windows Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Release Binary
        run: cargo build --release --verbose

      - name: Stage Artifacts
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/achievements-passport-desktop.exe dist/
          cp README.md dist/
          cd dist && 7z a ../achievements-passport-windows.zip *

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: achievements-passport-windows
          path: achievements-passport-windows.zip
          if-no-files-found: error
