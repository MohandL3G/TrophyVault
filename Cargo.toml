[package]
name = "trophyvault"
version = "0.0.6"
edition = "2021"
authors = ["MohandL3G"]
description = "TrophyVault: A luxury gaming achievements passport generator desktop application built in Rust"
license = "MIT"
readme = "README.md"
repository = "https://github.com/MohandL3G/TrophyVault"

[[bin]]
name = "TrophyVault"
path = "src/main.rs"

[build-dependencies]
winres = "0.1"

[dependencies]
# UI Framework (use Glow OpenGL backend for smooth desktop rendering without DX12/NVIDIA game overlay hooks)
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.29"

# Image processing & SVG rendering
image = { version = "0.25", default-features = false, features = ["png"] }
resvg = "0.44"
tiny-skia = "0.11"
usvg = "0.44"

# Serialization & Data
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# File Dialogs & Utilities
rfd = "0.15"
open = "5.3"
dirs = "5.0"
chrono = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
