services:
  trophyvault-web:
    image: ghcr.io/mohandl3g/trophyvault:latest
    container_name: trophyvault-web
    restart: unless-stopped
    ports:
      - "5050:5050"
    environment:
      - PORT=5050
      - API_KEY=trophyvault-secret-key-change-me
      - ADMIN_PASSWORD=trophyvault-admin-password-change-me
      - USERNAME=MohandL3G
      - SLOGAN=HUNTER
      - DATABASE_PATH=/data/library_database.json
      - AVATAR_PATH=/data/avatar.png
    volumes:
      - trophyvault-data:/data

volumes:
  trophyvault-data:
